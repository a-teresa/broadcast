# Aurascope only has 4 buttons (sw0-sw3), so BUTTON_4 is unassigned and the
# button-triggered DFU-mode entry in bt_mgmt_init() would fault at boot.
# Core FOTA (MCUboot image swap) does not depend on this feature.
CONFIG_AUDIO_BT_MGMT_DFU=n
