# Available runners configured by board.cmake.
runners:
- nrfutil
- nrfjprog
- jlink

# Default flash runner if --runner is not given.
flash-runner: nrfutil

# Default debug runner if --runner is not given.
debug-runner: jlink

# Common runner configuration values.
config:
  board_dir: /home/t/asset-tracker-template/nrf/boards/aurascope/aurascope
  # Build outputs:
  elf_file: zephyr.elf
  hex_file: /home/t/asset-tracker-template/nrf/applications/nrf5340_audio/build_broadcast_sink_bigbuf/merged_CPUNET.hex
  bin_file: zephyr.bin
  # Host tools:
  gdb: /home/t/ncs/toolchains/c5be9c56c7/opt/zephyr-sdk/arm-zephyr-eabi/bin/arm-zephyr-eabi-gdb

# Runner specific arguments
args:
  nrfutil:
    []

  nrfjprog:
    []

  jlink:
    - --dt-flash=y
    - --device=nrf5340_xxaa_net
    - --speed=4000
